[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = false

[advisories]
unmaintained = "all"
unsound = "all"
# Exact graph and unreachable advisory precondition reviewed in docs/dependencies.md.
# Owner: PiQuark6046. Review by 2026-10-16 and whenever Tantivy/lru change.
ignore = [{ id = "RUSTSEC-2026-0253", reason = "lru 0.16.4 only via Tantivy 0.26.2 BlockCache<usize,Block>; no pop call or panicking key Drop; review 2026-10-16" }]

[licenses]
confidence-threshold = 0.93
# Selected from the resolved graph; see docs/dependencies.md.
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC",
         "MIT-0", "Unicode-3.0", "Zlib"]
# First-party licensing only; do not admit AGPL dependencies globally.
# Owner: PiQuark6046. Review by 2026-12-12 and whenever package versions change.
exceptions = [
    # MeCab-Ko's mandatory watcher dependency; runtime hot reload is never enabled.
    # Owner: PiQuark6046. Review by 2026-12-19 or on MeCab-Ko/notify changes.
    { crate = "notify@6.1.1", allow = ["CC0-1.0"] },
    { crate = "webpki-roots@1.0.9", allow = ["CDLA-Permissive-2.0"] },
    { crate = "openlegal-server@0.1.0", allow = ["AGPL-3.0-only"] },
    { crate = "openlegal-domain@0.1.0", allow = ["AGPL-3.0-only"] },
    { crate = "openlegal-normalization@0.1.0", allow = ["AGPL-3.0-only"] },
    { crate = "openlegal-application@0.1.0", allow = ["AGPL-3.0-only"] },
    { crate = "openlegal-adapters@0.1.0", allow = ["AGPL-3.0-only"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
