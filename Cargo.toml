[workspace]
members = ["apps/server", "crates/domain", "crates/normalization", "crates/application", "crates/adapters"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-only"
repository = "https://github.com/piquark6046/openlegal4everyoneMCP"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
