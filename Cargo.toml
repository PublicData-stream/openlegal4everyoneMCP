[workspace]
members = ["apps/server", "crates/domain", "crates/normalization", "crates/application", "crates/adapters"]
exclude = ["vendor/mecab-ko-dict-0.7.2", "vendor/mecab-ko-dict-builder-0.7.2"]
resolver = "3"

[patch.crates-io]
# Published 0.7.2 sources with only the zstd security update; see vendor/README.md.
mecab-ko-dict = { path = "vendor/mecab-ko-dict-0.7.2" }
mecab-ko-dict-builder = { path = "vendor/mecab-ko-dict-builder-0.7.2" }

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-only"
repository = "https://github.com/PublicData-stream/openlegal4everyoneMCP"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
