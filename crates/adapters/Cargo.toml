[package]
name = "openlegal-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
openlegal-domain = { version = "0.1.0", path = "../domain" }
openlegal-normalization = { version = "0.1.0", path = "../normalization" }
openlegal-application = { version = "0.1.0", path = "../application" }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "1", features = ["net", "time", "process", "fs", "io-util"] }
similar = { version = "=3.2.0", default-features = false, features = ["std", "text"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
rustix = { version = "=1.1.4", features = ["fs", "process"] }
getrandom = "0.4"
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
httpdate = "1"
hickory-resolver = { version = "=0.26.2", default-features = false, features = ["tokio", "system-config"] }

[dev-dependencies]
tempfile = "3"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
