[package]
name = "openlegal-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
openlegal-domain = { version = "0.0.0", path = "../domain" }
openlegal-normalization = { version = "0.0.0", path = "../normalization" }
openlegal-application = { version = "0.0.0", path = "../application" }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "1", features = ["net", "time", "process", "fs", "io-util"] }
similar = { version = "=3.2.0", default-features = false, features = ["std", "text"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
rustix = { version = "=1.1.4", features = ["fs", "process"] }
getrandom = "0.4"
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
httpdate = "1"
hickory-resolver = { version = "=0.26.2", default-features = false, features = ["tokio", "system-config"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid", "json", "migrate"] }
uuid = { version = "1", default-features = false, features = ["std"] }
tantivy = { version = "=0.26.2", default-features = false, features = ["mmap", "lz4-compression"] }
lindera = { version = "=5.0.1", default-features = false, features = ["embed-ko-dic"] }
grep-regex = "=0.1.14"
grep-matcher = "=0.1.8"
unicode-normalization = "=0.1.25"
mecab-ko = { version = "=0.7.2", default-features = false }
mecab-ko-dict = { version = "=0.7.2", default-features = false }

[dev-dependencies]
mecab-ko-dict-builder = "=0.7.2"
csv = "1"
tempfile = "3"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
