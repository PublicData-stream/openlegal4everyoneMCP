name: Rust and transport checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: git diff --check
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Test PostgreSQL 18 persistence and history transports
        run: scripts/test-postgres.sh
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo audit
      - run: cargo deny check
  oxibelt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: npm install --global --ignore-scripts pnpm@12.3.4
      - run: pnpm --dir apps/widget install --frozen-lockfile
      - run: pnpm --dir apps/widget build
      - name: Test both transports through the pinned edge
        run: scripts/test-oxibelt.sh
        env:
          DEMO_WIDGET_HTML: apps/widget/dist/index.html
          TEXT_DIFF_WIDGET_HTML: apps/widget/dist/text-diff.html
  widget:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: npm install --global --ignore-scripts pnpm@12.3.4
      - run: pnpm --dir apps/widget install --frozen-lockfile
      - run: pnpm --dir apps/widget typecheck
      - run: pnpm --dir apps/widget test
      - run: pnpm --dir apps/widget build
      - run: pnpm --dir apps/widget exec playwright install --with-deps chromium
      - run: pnpm --dir apps/widget test:browser
      - run: pnpm --dir apps/widget check:dependencies
  document-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reserve space for native parser source and build caches
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          available_kib=$(df -Pk / | awk 'NR == 2 {print $4}')
          test "$available_kib" -ge 20971520
      - name: Build and validate confined native document processing
        run: scripts/test-document-worker.sh
