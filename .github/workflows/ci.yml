name: Rust and transport checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 4 * * 1'

jobs:
  rust:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check x86-64-v3 support
        if: runner.arch == 'X64'
        run: /lib64/ld-linux-x86-64.so.2 --help | grep -F 'x86-64-v3 (supported, searched)'
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --locked -p openlegal-server --example wt_client serving_smoke
      - run: git diff --check
  korean-tokenization:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check x86-64-v3 support
        if: runner.arch == 'X64'
        run: /lib64/ld-linux-x86-64.so.2 --help | grep -F 'x86-64-v3 (supported, searched)'
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Provision and test the complete Korean dictionary
        run: scripts/test-korean-tokenization.sh
  postgres:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check x86-64-v3 support
        if: runner.arch == 'X64'
        run: /lib64/ld-linux-x86-64.so.2 --help | grep -F 'x86-64-v3 (supported, searched)'
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Test PostgreSQL 18 persistence and history transports
        run: scripts/test-postgres.sh
  dependencies:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check x86-64-v3 support
        if: runner.arch == 'X64'
        run: /lib64/ld-linux-x86-64.so.2 --help | grep -F 'x86-64-v3 (supported, searched)'
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo audit
      - run: cargo deny check
  release-contract:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check GHCR release event and source invariants
        run: python3 -m unittest scripts.tests.test_release_image_contract
  oxibelt:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check x86-64-v3 support
        if: runner.arch == 'X64'
        run: /lib64/ld-linux-x86-64.so.2 --help | grep -F 'x86-64-v3 (supported, searched)'
      - run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: npm install --global --ignore-scripts pnpm@12.3.4
      - run: pnpm --dir apps/widget install --frozen-lockfile
      - run: pnpm --dir apps/widget build
      - name: Test both transports through the pinned edge
        run: scripts/test-oxibelt.sh
        env:
          DEMO_WIDGET_HTML: apps/widget/dist/index.html
          TEXT_DIFF_WIDGET_HTML: apps/widget/dist/text-diff.html
      - name: Test Kubernetes OxiBelt handoff in isolated Docker fixture
        run: scripts/test-oxibelt.sh --profile kubernetes
        env:
          OXIBELT_BINARY: target/oxibelt/debug/oxibelt
          DEMO_WIDGET_HTML: apps/widget/dist/index.html
          TEXT_DIFF_WIDGET_HTML: apps/widget/dist/text-diff.html
  widget:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: npm install --global --ignore-scripts pnpm@12.3.4
      - run: pnpm --dir apps/widget install --frozen-lockfile
      - run: pnpm --dir apps/widget typecheck
      - run: pnpm --dir apps/widget test
      - run: pnpm --dir apps/widget build
      - run: pnpm --dir apps/widget exec playwright install --with-deps chromium
      - run: pnpm --dir apps/widget test:browser
      - run: pnpm --dir apps/widget check:dependencies
  alpine-packages:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test Alpine fixture lifecycle and installer failure handling
        run: python3 -m unittest discover -s scripts/tests -p 'test_alpine_packages.py'
      - name: Test bounded Alpine downloads and verification failures
        run: scripts/test-alpine-packages.sh
  document-worker:
    permissions:
      contents: read
    needs: alpine-packages
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check x86-64-v3 support
        if: runner.arch == 'X64'
        run: /lib64/ld-linux-x86-64.so.2 --help | grep -F 'x86-64-v3 (supported, searched)'
      - name: Reserve space for native parser source and build caches
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          available_kib=$(df -Pk / | awk 'NR == 2 {print $4}')
          test "$available_kib" -ge 20971520
      - name: Build and validate confined native document processing
        run: scripts/test-document-worker.sh
  kubernetes-serving:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python virtual environment support
        run: sudo apt-get update && sudo apt-get install -y python3-venv
      - name: Provision pinned deployment validation tools
        run: scripts/setup-deployment-tools.sh
      - name: Check deployment sources, invariants and both Kubernetes schemas offline
        run: scripts/test-kubernetes-serving.sh
      - name: Test bounded serving smoke without external endpoints
        run: python3 -m unittest discover -s scripts/tests -p 'test_serving_smoke.py'
      - name: Test disposable acceptance preparation without a cluster
        run: target/deployment-tools/bin/python -m unittest discover -s test-support/kubernetes-acceptance -p 'test_*.py'
  server-image:
    permissions:
      contents: read
    needs: alpine-packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            platform: linux/amd64
            target: runtime
          - runner: ubuntu-26.04-arm
            platform: linux/arm64
            target: runtime
          - runner: ubuntu-26.04
            platform: linux/amd64
            target: runtime-ingestion
          - runner: ubuntu-26.04-arm
            platform: linux/arm64
            target: runtime-ingestion
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check x86-64-v3 support
        if: runner.arch == 'X64'
        run: /lib64/ld-linux-x86-64.so.2 --help | grep -F 'x86-64-v3 (supported, searched)'
      - name: Report available image-build storage
        run: df -h /
      - name: Install Python virtual environment support
        run: sudo apt-get update && sudo apt-get install -y python3-venv
      - name: Provision pinned deployment validation tools
        run: scripts/setup-deployment-tools.sh
      - name: Install pinned dictionary provisioning toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Provision the complete pinned Korean dictionary
        run: scripts/prepare-korean-dictionary.sh "$RUNNER_TEMP/retained-image-dictionary"
      - name: Build and test production image target and offline controller fixture
        run: scripts/test-server-image.sh --platform '${{ matrix.platform }}' --target '${{ matrix.target }}'
        env:
          OPENLEGAL_TEST_MECAB_DICTIONARY: ${{ runner.temp }}/retained-image-dictionary
  ci-summary:
    permissions:
      contents: read
    if: always()
    needs:
      - rust
      - korean-tokenization
      - postgres
      - dependencies
      - release-contract
      - oxibelt
      - widget
      - alpine-packages
      - document-worker
      - kubernetes-serving
      - server-image
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS_JSON"
