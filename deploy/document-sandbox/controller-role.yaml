# Bind this Role to the separately provisioned trusted controller identity.
# Parser Pods never mount its kubeconfig, token or another secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: document-controller
  namespace: openlegal-documents
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    # WebSocket exec uses GET; SPDY fallback uses POST/create.
    verbs: [get, create]
  - apiGroups: [""]
    resources: [resourcequotas]
    resourceNames: [document-budget]
    verbs: [get]
