apiVersion: v1
kind: Namespace
metadata:
  name: openlegal-documents
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: document-budget
  namespace: openlegal-documents
spec:
  hard:
    pods: "16"
    requests.cpu: "32"
    limits.cpu: "32"
    requests.memory: 64Gi
    limits.memory: 64Gi
    requests.ephemeral-storage: 32Gi
    limits.ephemeral-storage: 32Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: openlegal-documents
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: openlegal-document
handler: runc
scheduling:
  nodeSelector:
    openlegal.document-sandbox/ready: "true"
