# Run from the repository root after building apps/widget and preparing the demo TLS files.
# Git must be installed; no mock upstream is needed.
# Placeholder only: replace with free corresponding source for your running version.
[source]
url = "https://example.org/openlegal/source"

[http]
bind = "127.0.0.1:8080"
allowed_hosts = ["127.0.0.1:8080", "localhost:8080"]
allowed_origins = []

[webtransport]
bind = "127.0.0.1:4433"
certificate = "target/demo/cert.pem"
private_key = "target/demo/key.pem"
allowed_hosts = ["127.0.0.1:4433", "localhost:4433"]
allowed_origins = []

[health]
bind = "127.0.0.1:9090"

[limits]
max_message_bytes = 16777216
max_buffer_bytes = 268435456

[text_diff]
git_path = "/usr/bin/git"
widget_html = "apps/widget/dist/text-diff.html"
