# Run from the repository root after building apps/widget and starting mock_upstream.
# Placeholder only: replace with free corresponding source for your running version.
[source]
url = "https://example.org/openlegal/source"

[http]
bind = "127.0.0.1:8080"
allowed_hosts = ["127.0.0.1:8080", "localhost:8080"]
allowed_origins = []

[webtransport]
bind = "127.0.0.1:4433"
certificate = "target/demo/cert.pem"
private_key = "target/demo/key.pem"
allowed_hosts = ["127.0.0.1:4433", "localhost:4433"]
allowed_origins = []

[health]
bind = "127.0.0.1:9090"

[limits]
max_message_bytes = 16777216
max_buffer_bytes = 268435456

[demo]
upstream = "http://127.0.0.1:8081"
widget_html = "apps/widget/dist/index.html"

[cache]
mode = "persistent"
retention_days = 30
max_blob_bytes = 1073741824
max_snapshots_per_query = 100
max_snapshots = 10000
max_queries = 4096

[cache.postgres]
url_env = "OPENLEGAL_DATABASE_URL"
migration_url_env = "OPENLEGAL_MIGRATION_DATABASE_URL"
max_connections = 16
# Explicitly isolated local demonstration; production defaults to verify-full.
tls_mode = "plaintext"

[cache.blob]
kind = "filesystem"
path = "target/demo/blobs"

[text_diff]
widget_html = "apps/widget/dist/text-diff.html"
