# Schema/source pin: OxiBelt 0.10.0 (e879ac7e263b0af9a86280cd8799de44cbffc05c).
[config]
strict_unknown_fields = true

[logging]
level = "warn"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = 2

[runtime.accept]
workers = 1
reuse_port = false

[quic.socket]
workers = 1
reuse_port = false

[runtime.hot_reload]
mode = "off"

[listeners]
https_bind = "0.0.0.0:8443"
http1 = true
http2 = true
http3 = true

[tls]
cert_chain = "edge.pem"
private_key = "edge-key.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = ["ca.pem"]

[proxy.auto_upgrade]
enabled = true
max_http_version = "h3"

[proxy.buffering]
request = "streaming"
response = "streaming"

[compression]
enabled = false

[cache]
enabled = false

[waf]
enabled = true
mode = "enforcing"

[[waf.rules]]
name = "mcp-webtransport-handshake-budget"
id = "ol-mcp-wt-handshake-rate"
phase = "request"
priority = 100
when = "Request.Http.Path == '/mcp-wt/v1'"

[[waf.rules.actions]]
type = "rate_limit"
name = "mcp-webtransport-handshakes"
key = "route"
rate = "100r/s"
burst = 100
max_buckets = 1
status = 429

[[rate_limits]]
name = "mcp-http-edge-budget"
key = "route"
routes = ["mcp-http"]
rate = "1000r/s"
burst = 1000
max_buckets = 1
status = 429

[[upstreams]]
name = "mcp-http"
origin = "https://backend:8080"
max_http_version = "h1"
preserve_host = false
connect_timeout_ms = 3000
request_timeout_ms = 40000

[upstreams.tls.client_identity]
cert_chain = "openlegal-client.pem"
private_key = "openlegal-client-key.pem"

[upstreams.tls.ech]
mode = "disabled"

[[upstreams]]
name = "mcp-webtransport"
origin = "https://backend:4433"
max_http_version = "h3"
preserve_host = false
webtransport = true
connect_timeout_ms = 3000
request_timeout_ms = 40000
idle_timeout_ms = 65000

[upstreams.tls.client_identity]
cert_chain = "openlegal-client.pem"
private_key = "openlegal-client-key.pem"

[upstreams.tls.ech]
mode = "disabled"

[[routes]]
name = "mcp-http"
hosts = ["edge"]
upstream = "mcp-http"
compression = "off"
[routes.limits]
# Two 1 MiB texts can occupy approximately 12 MiB after JSON escaping.
max_request_body_bytes = 16777216
[routes.match.path]
exact = "/mcp"

[[routes]]
name = "mcp-webtransport"
hosts = ["edge"]
upstream = "mcp-webtransport"
[routes.match]
methods = ["CONNECT"]
protocols = ["webtransport"]
[routes.match.path]
exact = "/mcp-wt/v1"
