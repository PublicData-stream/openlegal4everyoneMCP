# Both transport listeners are reachable only on the private container network.
# Isolated fixture only; a deployment must supply its actual corresponding source.
[source]
url = "https://example.org/openlegal/source"

[http]
bind = "0.0.0.0:8080"
allowed_hosts = ["backend:8080"]
allowed_origins = ["https://example.test"]

[webtransport]
bind = "0.0.0.0:4433"
certificate = "/fixture/cert/backend.pem"
private_key = "/fixture/cert/backend-key.pem"
allowed_hosts = ["backend:4433"]
allowed_origins = ["https://example.test"]

[health]
bind = "0.0.0.0:9090"
