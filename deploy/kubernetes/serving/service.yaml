apiVersion: v1
kind: Service
metadata:
  name: openlegal-server
spec:
  # Restrict both NodePorts to the trusted edge/private path before applying.
  # This Service does not install a firewall or isolate Pod networking.
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: openlegal-server
  ports:
    - name: mcp-http
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
    - name: mcp-webtransport
      protocol: UDP
      port: 4433
      targetPort: 4433
      nodePort: 30433
