# Phase 2 text-only example. See docs/deployment-kubernetes.md before deployment.
# Replace with free corresponding source for the exact running server and widget.
[source]
url = "https://example.org/openlegal/source"

[http]
bind = "0.0.0.0:8080"
allowed_hosts = ["localhost:8080", "127.0.0.1:8080"]
allowed_origins = []

[webtransport]
bind = "0.0.0.0:4433"
certificate = "/run/secrets/backend-tls/tls.crt"
private_key = "/run/secrets/backend-tls/tls.key"
allowed_hosts = ["localhost:4433", "127.0.0.1:4433"]
allowed_origins = []

[health]
bind = "0.0.0.0:9090"

[limits]
max_message_bytes = 16777216
max_buffer_bytes = 268435456
shutdown_timeout_secs = 15

[text_diff]
widget_html = "/opt/openlegal/widgets/text-diff.html"
