apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openlegal-allow-dns
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - openlegal-server
          - openlegal-admin
  policyTypes:
    - Egress
  egress:
    - to:
        # Verify and tailor both selectors outside Git for the chosen cluster DNS.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
