# Apply separately from serving, after substituting capacities to match PVs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openlegal-cache-blobs
  namespace: openlegal-serving
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  storageClassName: openlegal-local
  volumeName: openlegal-cache-blobs
  resources:
    requests:
      storage: REPLACE_WITH_CACHE_BLOBS_CAPACITY
---
