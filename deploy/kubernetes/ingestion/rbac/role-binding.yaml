# Requires the unchanged deploy/document-sandbox/controller-role.yaml Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openlegal-document-controller
  namespace: openlegal-documents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: document-controller
subjects:
  - kind: ServiceAccount
    name: openlegal-document-controller
    namespace: openlegal-serving
