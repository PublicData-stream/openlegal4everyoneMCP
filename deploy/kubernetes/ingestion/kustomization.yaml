apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openlegal-serving
resources:
  - ../serving
  - service-account.yaml
  - scheduler-service-account.yaml
  - scheduler-deployment.yaml
  - scheduler-role.yaml
  - serving-quota.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: openlegal-collection-config
    files:
      - server.toml
      - collection-job.json
  - name: openlegal-document-controller-config
    files:
      - kubeconfig
