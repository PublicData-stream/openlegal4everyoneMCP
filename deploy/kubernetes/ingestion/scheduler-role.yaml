apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: collection-scheduler
  namespace: openlegal-serving
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: collection-scheduler
  namespace: openlegal-serving
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: collection-scheduler
subjects:
  - kind: ServiceAccount
    name: openlegal-collection-scheduler
    namespace: openlegal-serving
